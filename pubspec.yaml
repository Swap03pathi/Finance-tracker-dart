name: finman_engine
description: >-
  AI Personal CFO — device app + on-device SMS parsing core (Dart port of the TS @finman/engine
  reference). Privacy-first: raw SMS never leaves the device; only redacted skeletons cross the wire.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  decimal: ^3.0.0          # decimal.js parity for exact paise
  crypto: ^3.0.3           # sha256 fingerprint
  uuid: ^4.5.0             # deterministic UUIDv5 entry ids
  http: ^1.2.0             # sync client
  drift: ^2.20.0           # local SQLite
  sqlite3: ^2.4.0          # host sqlite for tests
  sqlite3_flutter_libs: ^0.5.24   # bundled native sqlite on-device
  path_provider: ^2.1.4    # device DB path
  path: ^1.9.0
  permission_handler: ^11.3.1     # READ_SMS runtime permission
  fl_chart: ^0.69.0        # donut + stacked bar charts on the dashboard
  flutter_local_notifications: ^17.2.3   # "assign a category" push for new merchants

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - config/   # doc 07 §6 rule data, loaded on-device via rootBundle then primeConfig()
